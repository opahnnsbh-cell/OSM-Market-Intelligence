name: Build OSM Market Intelligence APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'OSM_Market_Intelligence_FINAL_1.0_CLOUD_READY.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded ZIP
        run: |
          test -f OSM_Market_Intelligence_FINAL_1.0_CLOUD_READY.zip
          ls -lh OSM_Market_Intelligence_FINAL_1.0_CLOUD_READY.zip

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q OSM_Market_Intelligence_FINAL_1.0_CLOUD_READY.zip -d extracted
          test -f extracted/OSMMarketIntelligenceFinal/settings.gradle.kts
          test -f extracted/OSMMarketIntelligenceFinal/app/build.gradle.kts
          echo "Android project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          sdkmanager --version || true

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: extracted/OSMMarketIntelligenceFinal
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: extracted/OSMMarketIntelligenceFinal
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        run: |
          APK="extracted/OSMMarketIntelligenceFinal/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          cp "$APK" OSM-Market-Intelligence-1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSM-Market-Intelligence-APK
          path: OSM-Market-Intelligence-1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
          
